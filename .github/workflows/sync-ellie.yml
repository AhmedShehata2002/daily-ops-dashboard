name: Sync Ellie Tasks

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Sync Ellie tasks to data.json
        env:
          ELLIE_MCP_URL: ${{ secrets.ELLIE_MCP_URL }}
          ELLIE_API_KEY: ${{ secrets.ELLIE_API_KEY }}
        run: node .github/scripts/sync-ellie.js

      - name: Commit if changed
        run: |
          git config user.name "Daily Ops Bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "sync: ellie tasks [skip ci]"
          git pull --rebase && git push
