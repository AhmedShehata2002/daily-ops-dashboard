name: Update CFA Progress

on:
  workflow_dispatch:
    inputs:
      percent:
        description: 'Completion % (0–100)'
        required: true
        default: '37'
      topic:
        description: 'Current topic'
        required: true
        default: 'Fixed Income'
      progressText:
        description: 'Study progress (e.g. 1h 30m / 2h)'
        required: true
        default: '1h 12m / 1h 30m'
      next:
        description: 'Next topic'
        required: true
        default: 'Derivatives'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update CFA in data.json
        env:
          PERCENT: ${{ inputs.percent }}
          TOPIC: ${{ inputs.topic }}
          PROGRESS_TEXT: ${{ inputs.progressText }}
          NEXT_TOPIC: ${{ inputs.next }}
        run: |
          node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('data.json', 'utf8'));
            d.cfa = {
              percent: Number(process.env.PERCENT),
              topic: process.env.TOPIC,
              progressText: process.env.PROGRESS_TEXT,
              next: process.env.NEXT_TOPIC
            };
            fs.writeFileSync('data.json', JSON.stringify(d, null, 2) + '\n');
          "

      - name: Commit
        run: |
          git config user.name "Daily Ops Bot"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "update: CFA → ${{ inputs.percent }}% (${{ inputs.topic }})"
          git push
