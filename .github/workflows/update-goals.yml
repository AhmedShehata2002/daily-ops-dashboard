name: Update Goals

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: 'Which goals to update'
        required: true
        type: choice
        options:
          - Long Term (1-5 years)
          - Mid Term (3-12 months)
          - Short Term (this month)
      goals:
        description: 'Goals — one per line (replaces existing list)'
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update goals in data.json
        env:
          TIMEFRAME: ${{ inputs.timeframe }}
          GOALS:     ${{ inputs.goals }}
        run: |
          node -e "
            const fs = require('fs');
            const d  = JSON.parse(fs.readFileSync('data.json', 'utf8'));
            const items = process.env.GOALS.split('\n').map(s => s.trim()).filter(Boolean);
            const tf = process.env.TIMEFRAME;
            if (tf.startsWith('Long'))  d.goalsLong  = items;
            if (tf.startsWith('Mid'))   d.goalsMid   = items;
            if (tf.startsWith('Short')) d.goalsShort = items;
            fs.writeFileSync('data.json', JSON.stringify(d, null, 2) + '\n');
          "

      - name: Commit
        run: |
          git config user.name "Daily Ops Bot"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "update: goals (${{ inputs.timeframe }})"
          git push
