<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Ops">
<meta name="theme-color" content="#0a0a0a">
<title>Daily Ops</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --card-bg:#0c0c0c;
    --border:#232323;
    --border-soft:#1a1a1a;
    --text-1:#f2f1ec;
    --text-2:#8a8a86;
    --text-3:#4d4d4a;
    --dot-empty:#242422;
    --dot-fill:#f2f1ec;
    --radius:18px;
    --font-mono:'JetBrains Mono', ui-monospace, monospace;
    --font-dot:'Silkscreen', var(--font-mono);
    --warn:#c47c2b;
    --error:#c43b2b;
    --ok:#4caf7a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--text-1);
    font-family:var(--font-mono); overflow:hidden; overscroll-behavior:none; user-select:none;
  }
  .app{ display:flex; height:100vh; width:100vw; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:64px; flex-shrink:0; display:flex; flex-direction:column; align-items:center;
    padding:26px 0; gap:8px; border-right:1px solid var(--border-soft);
  }
  .sidebar .grid-icon{ color:var(--text-2); margin-bottom:26px; }
  .side-btn{
    width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    border-radius:12px; color:var(--text-3);
  }
  .side-btn.active{ background:#1c1c1a; color:var(--text-1); }
  .sidebar .spacer{ flex:1; }
  .sidebar .avatar{ width:22px; height:22px; border-radius:50%; border:1.5px solid var(--text-3); }

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; padding:28px 34px 20px; display:flex; flex-direction:column; gap:20px; }

  .header-top{ display:flex; justify-content:space-between; align-items:center; }
  .brand{ font-size:12px; letter-spacing:3px; color:var(--text-2); }
  .status-icons{ display:flex; align-items:center; gap:10px; color:var(--text-2); font-size:13px; }

  .header-main{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:4px; }
  .clock{ display:flex; align-items:baseline; gap:12px; }
  .clock-time{ font-family:var(--font-dot); font-size:64px; line-height:1; letter-spacing:2px; }
  .clock-ampm{ font-size:16px; color:var(--text-2); letter-spacing:1px; }

  .header-right{ display:flex; align-items:center; gap:22px; }
  .date-text{ font-size:14px; color:var(--text-2); letter-spacing:1px; white-space:nowrap; }
  .weather{ display:flex; align-items:center; gap:10px; }
  .weather-temp{ font-size:26px; }
  .weather-city{ font-size:11px; color:var(--text-2); letter-spacing:1px; margin-top:-2px; }

  /* ---------- Grid ---------- */
  .grid{
    flex:1; display:grid; grid-template-columns:repeat(3, 1fr); grid-template-rows:repeat(3, 1fr);
    gap:16px; min-height:0;
  }
  .card{
    background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; display:flex; flex-direction:column; min-height:0; overflow:hidden;
  }
  .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .card-title{ display:flex; align-items:center; gap:8px; font-size:12.5px; letter-spacing:1.6px; color:var(--text-1); }
  .card-title .ring{ width:12px; height:12px; border-radius:50%; border:1.4px solid var(--text-2); position:relative; flex-shrink:0; }
  .card-title .ring::after{ content:""; position:absolute; inset:3px; border-radius:50%; background:var(--text-2); }
  .card-menu{ color:var(--text-3); font-size:16px; letter-spacing:2px; }
  .card-sub{ font-size:10.5px; color:var(--text-3); letter-spacing:1px; margin:-2px 0 8px 20px; }

  /* ---------- Skeleton ---------- */
  .skeleton{ height:12px; border-radius:4px; background:var(--border); margin:6px 0; animation:pulse 1.6s ease-in-out infinite; }
  .skeleton.w60{ width:60%; }
  .skeleton.w80{ width:80%; }
  .skeleton.w40{ width:40%; }
  @keyframes pulse{ 0%,100%{opacity:.4} 50%{opacity:.9} }

  /* ---------- Stale badge ---------- */
  .stale-badge{
    display:inline-block; font-size:8px; color:var(--warn); letter-spacing:1px;
    border:1px solid var(--warn); border-radius:3px; padding:1px 5px; margin-left:8px; opacity:.7;
  }

  /* ---------- Today / Tasks ---------- */
  .task-row{ display:flex; align-items:center; gap:11px; padding:6px 0; font-size:13px; }
  .checkbox{ width:15px; height:15px; border-radius:4px; border:1.4px solid var(--text-3); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .checkbox.checked{ background:var(--text-1); border-color:var(--text-1); }
  .checkbox.checked svg{ width:9px; height:9px; }
  .task-row.done .task-label{ color:var(--text-3); text-decoration:line-through; }
  .task-list{ flex:1; overflow:hidden; }

  /* ---------- CFA ---------- */
  .cfa-body{ display:flex; align-items:center; gap:26px; flex:1; }
  .cfa-info{ display:flex; flex-direction:column; gap:14px; font-size:12.5px; }
  .cfa-label{ color:var(--text-3); letter-spacing:1px; font-size:10.5px; margin-bottom:3px; }
  .cfa-value{ color:var(--text-1); font-size:14px; }

  /* ---------- Prayer Times ---------- */
  .prayer-list{ flex:1; display:flex; flex-direction:column; justify-content:center; }
  .prayer-row{ display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border-soft); }
  .prayer-row:last-child{ border-bottom:none; }
  .prayer-left{ display:flex; align-items:center; gap:8px; }
  .prayer-name{ font-size:11px; color:var(--text-3); letter-spacing:1.2px; }
  .prayer-time{ font-size:13px; color:var(--text-2); }
  .prayer-row.next .prayer-name{ color:var(--text-1); }
  .prayer-row.next .prayer-time{ color:var(--text-1); font-size:14px; }
  .next-badge{ font-size:8px; color:var(--text-3); letter-spacing:1px; border:1px solid var(--border); border-radius:3px; padding:1px 5px; }

  /* ---------- Calendar ---------- */
  .cal-row{ display:flex; align-items:center; gap:12px; padding:6px 0; font-size:13px; }
  .cal-time{ color:var(--text-2); width:44px; flex-shrink:0; }
  .cal-dot{ width:6px; height:6px; border-radius:50%; background:var(--text-3); flex-shrink:0; }
  .cal-footer{ display:flex; justify-content:space-between; align-items:center; padding-top:9px; margin-top:auto; border-top:1px solid var(--border-soft); font-size:12px; color:var(--text-2); }

  /* ---------- Focus Timer ---------- */
  .timer-body{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding-top:2px; }
  .timer-mode-row{ display:flex; gap:18px; }
  .timer-mode-btn{
    font-size:9.5px; color:var(--text-3); letter-spacing:1.5px; cursor:pointer;
    padding-bottom:3px; background:none; border:none; border-bottom:1px solid transparent;
    font-family:var(--font-mono);
  }
  .timer-mode-btn.active{ color:var(--text-1); border-bottom-color:var(--text-2); }
  .timer-ring-wrap{ position:relative; width:116px; height:116px; flex-shrink:0; }
  .timer-ring-wrap svg{ position:absolute; inset:0; }
  .timer-time{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-dot); font-size:26px; letter-spacing:2px;
  }
  .timer-controls{ display:flex; gap:8px; width:100%; }
  .timer-btn{
    flex:1; background:none; border:1px solid var(--border); color:var(--text-3);
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:1.5px;
    padding:8px 0; border-radius:8px; cursor:pointer;
  }
  .timer-btn.go{ border-color:var(--text-2); color:var(--text-1); }
  .timer-sessions{ font-size:9.5px; color:var(--text-3); letter-spacing:1px; }

  /* ---------- Attention ---------- */
  .attention-list{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:2px; }
  .att-item{ display:flex; align-items:flex-start; gap:8px; padding:5px 0; font-size:12px; line-height:1.4; border-bottom:1px solid var(--border-soft); }
  .att-item:last-child{ border-bottom:none; }
  .att-icon{ width:14px; height:14px; border-radius:50%; flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:700; }
  .att-icon.urgent{ background:var(--error); color:#fff; }
  .att-icon.warn  { background:var(--warn);  color:#fff; }
  .att-icon.info  { background:var(--border); color:var(--text-2); }
  .att-text{ color:var(--text-2); }
  .att-clear{ font-size:12px; color:var(--text-3); letter-spacing:1px; text-align:center; padding:16px 0; }

  /* ---------- Up Next ---------- */
  .up-row{ display:flex; align-items:center; justify-content:space-between; padding:7px 0; font-size:13px; }
  .up-left{ display:flex; align-items:center; gap:10px; }
  .up-right{ color:var(--text-2); font-size:12px; flex-shrink:0; }

  /* ---------- Day Status ---------- */
  .daystatus-body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:10px; }
  .status-label{
    font-family:var(--font-dot); font-size:22px; letter-spacing:2px; text-align:center;
    padding:6px 0;
  }
  .status-label.on-track { color:var(--ok); }
  .status-label.tight    { color:var(--warn); }
  .status-label.overloaded{ color:var(--error); }
  .status-label.clear    { color:var(--text-3); }
  .status-row{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-3); letter-spacing:1px; }
  .status-val{ color:var(--text-2); }
  .progress-bar{ height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
  .progress-bar-fill{ height:100%; background:var(--dot-fill); border-radius:2px; transition:width .4s; }

  /* ---------- This Week ---------- */
  .week-list{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:2px; }
  .week-row{ display:flex; align-items:center; justify-content:space-between; padding:6px 0; font-size:12px; border-bottom:1px solid var(--border-soft); }
  .week-row:last-child{ border-bottom:none; }
  .week-key{ color:var(--text-3); letter-spacing:1px; }
  .week-val{ color:var(--text-1); }

  svg{ display:block; }
</style>
</head>
<body>
<div class="app">

  <div class="sidebar">
    <svg class="grid-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
      <g fill="currentColor"><circle cx="2" cy="2" r="1.4"/><circle cx="9" cy="2" r="1.4"/><circle cx="16" cy="2" r="1.4"/>
      <circle cx="2" cy="9" r="1.4"/><circle cx="9" cy="9" r="1.4"/><circle cx="16" cy="9" r="1.4"/>
      <circle cx="2" cy="16" r="1.4"/><circle cx="9" cy="16" r="1.4"/><circle cx="16" cy="16" r="1.4"/></g>
    </svg>
    <div class="side-btn active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    </div>
    <div class="side-btn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h12v18l-6-4-6 4V3z"/></svg>
    </div>
    <div class="side-btn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    </div>
    <div class="side-btn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
    </div>
    <div class="side-btn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.9 2.9l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.6V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.9-2.9l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.6-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.9-2.9l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.6V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.6 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.9 2.9l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.6 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.6 1z"/></svg>
    </div>
    <div class="spacer"></div>
    <div class="avatar"></div>
  </div>

  <div class="main">

    <div class="header-top">
      <div class="brand">DAILY OPS</div>
      <div class="status-icons">
        <svg width="15" height="12" viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8a17 17 0 0120 0M6 12a11 11 0 0112 0M10 16a5 5 0 014 0"/></svg>
        <svg width="20" height="12" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="21" height="12" rx="2.5"/><rect x="23" y="4.5" width="2" height="5" rx="1" fill="currentColor" stroke="none"/><rect x="3" y="3" width="15" height="8" rx="1" fill="currentColor" stroke="none" opacity="0.85"/></svg>

    <div class="header-main">

        <span class="clock-time" id="clock-time">--:--</span>

      </div>
      <div class="header-right">
        <div class="date-text" id="date-text">---, -- ---</div>
        <div class="weather">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="1.5"><path d="M7 18a4 4 0 010-8 5 5 0 019.6-1.5A4 4 0 0118 18H7z"/></svg>

        <div class="prayer-list" id="prayer-list">

      <!-- CALENDAR -->
      <div class="card" id="card-calendar">

          <div class="card-title"><span class="ring"></span>CALENDAR</div>
          <div class="card-menu">⋮</div>
        </div>

          <div class="skeleton w60"></div>

      <!-- FOCUS TIMER -->

          </div>

        </div>
      </div>

      <!-- ATTENTION -->
      <div class="card" id="card-attention">
        <div class="card-head">
          <div class="card-title"><span class="ring"></span>ATTENTION</div>
          <div class="card-menu">⋮</div>
        </div>
        <div class="card-sub">DERIVED · LIVE</div>
        <div class="attention-list" id="attention-list">
          <div class="skeleton w80"></div>
          <div class="skeleton w60"></div>
        </div>
      </div>

      <!-- UP NEXT -->
      <div class="card" id="card-upnext">
        <div class="card-head">
          <div class="card-title"><span class="ring"></span>UP NEXT</div>
          <div class="card-menu">⋮</div>
        </div>
        <div id="upnext-list">
          <div class="skeleton w80"></div>
          <div class="skeleton w60"></div>
        </div>
      </div>

      <!-- DAY STATUS -->
      <div class="card" id="card-day-status">
        <div class="card-head">
          <div class="card-title"><span class="ring"></span>DAY STATUS</div>

      </div>

    </div>

</div>

<script src="js/derived.js"></script>
<script>
/* ================================================================
   DATA LAYER
   ================================================================ */
const DEFAULT_DATA = {
  cfa:   { percent: 0, topic: '—', progressText: '—', next: '—' },
  ellie: { tasks: [], syncedAt: null, connected: false, error: null },
  gcal:  { tasks: [], events: [], upcoming: [], syncedAt: null, error: null }
};

let DASHBOARD_DATA  = DEFAULT_DATA;
let lastDataFetchOk = false;
const DATA_REFRESH_MS = 5 * 60 * 1000;

async function loadData() {
  try {
    const res = await fetch(`data.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const fresh = await res.json();
    // Merge — keep existing keys if not present in fresh
    DASHBOARD_DATA  = Object.assign({}, DEFAULT_DATA, fresh);
    lastDataFetchOk = true;
  } catch (e) {
    if (!lastDataFetchOk) console.warn('data.json unavailable — using fallback.', e);
    lastDataFetchOk = false;
  }
  renderAll();
}

function renderAll() {
  renderToday();
  renderCfa();
  renderCalendar();
  renderUpNext();
  renderAttention();
  renderDayStatus();
  renderWeek();
}

/* ================================================================
   CLOCK & DATE
   ================================================================ */
function pad(n) { return n.toString().padStart(2, '0'); }

function updateClock() {
  const now  = new Date();
  let h      = now.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  document.getElementById('clock-time').textContent = `${pad(h)}:${pad(now.getMinutes())}`;
  document.getElementById('clock-ampm').textContent  = ampm;
  const days   = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

  document.getElementById('date-text').textContent =
    `${days[now.getDay()]}, ${pad(now.getDate())} ${months[now.getMonth()]}`;
}

setInterval(updateClock, 15000);

/* ================================================================
   PRAYER TIMES
   ================================================================ */
const PRAYER_NAMES = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];

function nextPrayer(timings) {
  const now  = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  for (const p of PRAYER_NAMES) {
    const [h, m] = timings[p].split(':').map(Number);
    if (h * 60 + m > mins) return p;
  }
  return PRAYER_NAMES[0];
}

async function loadPrayer() {
  const cacheKey  = `prayer_${new Date().toLocaleDateString('en-CA')}`;
  const cached    = localStorage.getItem(cacheKey);
  let timings;

  if (cached) {
    timings = JSON.parse(cached);
  } else {
    try {
      const res  = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Cairo&country=Egypt&method=5');
      const json = await res.json();
      timings    = json.data.timings;
      localStorage.setItem(cacheKey, JSON.stringify(timings));
    } catch (e) {
      document.getElementById('prayer-list').innerHTML =
        '<div style="color:var(--text-3);font-size:12px">Unable to load</div>';
      return;
    }
  }

  const next = nextPrayer(timings);
  document.getElementById('prayer-list').innerHTML = PRAYER_NAMES.map(p => {
    const isNext  = p === next;
    const [h, m]  = timings[p].split(':').map(Number);
    const ampm    = h >= 12 ? 'PM' : 'AM';
    const timeStr = `${pad(h % 12 || 12)}:${pad(m)} ${ampm}`;
    return `<div class="prayer-row${isNext ? ' next' : ''}">
      <div class="prayer-left">
        <span class="prayer-name">${p.toUpperCase()}</span>
        ${isNext ? '<span class="next-badge">NEXT</span>' : ''}
      </div>
      <span class="prayer-time">${timeStr}</span>
    </div>`;
  }).join('');
}
loadPrayer();
setInterval(loadPrayer, 60 * 60 * 1000);

/* ================================================================
   FOCUS TIMER — localStorage timestamp persistence
   ================================================================ */
const WORK_SECS  = 25 * 60;
const BREAK_SECS =  5 * 60;
const TIMER_KEY  = 'focus_timer';

function todayKey() { return new Date().toISOString().slice(0, 10); }

function timerLoad() {
  try { return JSON.parse(localStorage.getItem(TIMER_KEY)) || {}; } catch (_) { return {}; }
}

function timerSave(state) {
  localStorage.setItem(TIMER_KEY, JSON.stringify(state));
}

function getSessionCount() {
  const s = timerLoad();
  return (s.date === todayKey()) ? (s.sessions || 0) : 0;
}

function incSessionCount() {
  const s        = timerLoad();
  const sessions = (s.date === todayKey() ? (s.sessions || 0) : 0) + 1;
  timerSave({ ...s, date: todayKey(), sessions });
  return sessions;
}

// Timer state
let timerMode    = 'work';
let timerRunning = false;
let timerTotal   = WORK_SECS;
let timerInterval = null;

// Returns remaining seconds (reads from localStorage timestamps when running)
function getTimerRemaining() {
  const s = timerLoad();
  if (s.running && s.endMs) {
    const rem = Math.ceil((s.endMs - Date.now()) / 1000);
    return Math.max(0, rem);
  }
  if (s.mode === timerMode && typeof s.remainingMs === 'number') {
    return Math.ceil(s.remainingMs / 1000);
  }
  return timerTotal;
}

function drawTimerRing(remainingSecs) {
  const pct    = 1 - remainingSecs / timerTotal;
  const dots   = 48;
  const filled = Math.round(pct * dots);
  const cx = 58, cy = 58, r = 50;
  let inner = '';
  for (let i = 0; i < dots; i++) {
    const angle = (i / dots) * Math.PI * 2 - Math.PI / 2;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    inner += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="${i < filled ? 'var(--dot-fill)' : 'var(--dot-empty)'}"/>`;
  }
  document.getElementById('timer-svg').innerHTML = inner;
}

function renderTimer() {
  const secs = getTimerRemaining();
  const m    = Math.floor(secs / 60);
  const s    = secs % 60;
  document.getElementById('timer-time').textContent = `${pad(m)}:${pad(s)}`;
  const btn = document.getElementById('timer-start');
  btn.textContent = timerRunning ? 'PAUSE' : 'START';
  btn.classList.toggle('go', !timerRunning);
  const sessions = getSessionCount();
  document.getElementById('timer-sessions').textContent =
    `${sessions} SESSION${sessions !== 1 ? 'S' : ''} TODAY`;
  drawTimerRing(secs);
}

function timerTick() {
  const secs = getTimerRemaining();
  if (secs <= 0) {
    clearInterval(timerInterval);
    timerRunning = false;
    if (timerMode === 'work') incSessionCount();
    switchTimerMode(timerMode === 'work' ? 'break' : 'work');
    return;
  }
  renderTimer();
}

function switchTimerMode(mode) {
  timerMode  = mode;
  timerTotal = mode === 'work' ? WORK_SECS : BREAK_SECS;
  timerRunning = false;
  clearInterval(timerInterval);
  timerSave({ mode, running: false, remainingMs: timerTotal * 1000, date: todayKey(), sessions: getSessionCount() });
  document.getElementById('timer-mode-work').classList.toggle('active',  mode === 'work');
  document.getElementById('timer-mode-break').classList.toggle('active', mode === 'break');
  renderTimer();
}

// Restore state on load
(function restoreTimer() {
  const s = timerLoad();
  if (s.mode) {
    timerMode  = s.mode;
    timerTotal = timerMode === 'work' ? WORK_SECS : BREAK_SECS;
    document.getElementById('timer-mode-work').classList.toggle('active',  timerMode === 'work');
    document.getElementById('timer-mode-break').classList.toggle('active', timerMode === 'break');
  }
  if (s.running && s.endMs && s.endMs > Date.now()) {
    timerRunning  = true;
    timerInterval = setInterval(timerTick, 1000);
  }
  renderTimer();
})();

document.getElementById('timer-start').addEventListener('click', () => {
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    const remaining = getTimerRemaining();
    timerSave({ ...timerLoad(), running: false, remainingMs: remaining * 1000, endMs: null });
  } else {
    const remaining = getTimerRemaining();
    timerRunning    = true;
    const endMs     = Date.now() + remaining * 1000;
    timerSave({ ...timerLoad(), running: true, endMs, mode: timerMode });
    timerInterval = setInterval(timerTick, 1000);
  }
  renderTimer();
});

document.getElementById('timer-reset').addEventListener('click', () => {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSave({ ...timerLoad(), running: false, remainingMs: timerTotal * 1000, endMs: null });
  renderTimer();
});

document.getElementById('timer-mode-work').addEventListener('click',  () => switchTimerMode('work'));
document.getElementById('timer-mode-break').addEventListener('click', () => switchTimerMode('break'));

/* ================================================================
   TODAY
   ================================================================ */
function renderToday() {
  const data   = DASHBOARD_DATA;
  const tasks  = Derived.getTodaysTasks(data);
  const source = (data.ellie && data.ellie.connected) ? 'ELLIE · LIVE' : 'GOOGLE CAL · ALL-DAY';
  document.getElementById('today-sub').textContent = source;

  if (!tasks.length) {
    document.getElementById('task-list').innerHTML =
      '<div style="color:var(--text-3);font-size:12px;padding:8px 0">' +
      ((data.ellie && data.ellie.connected) ? 'No tasks in Ellie today.' : 'Add all-day events in Google Calendar to see tasks here.') +
      '</div>';
    return;
  }

  document.getElementById('task-list').innerHTML = tasks.map(t => `
    <div class="task-row ${t.done ? 'done' : ''}">
      <div class="checkbox ${t.done ? 'checked' : ''}">
        ${t.done ? '<svg viewBox="0 0 12 12" fill="none" stroke="#0a0a0a" stroke-width="2"><path d="M2 6l3 3 5-6"/></svg>' : ''}
      </div>
      <div class="task-label">${t.label}</div>
    </div>`).join('');
}

/* ================================================================
   CFA RING — LOCKED, DO NOT CHANGE
   ================================================================ */
function renderCfa(){
  const { percent, topic, progressText, next } = DASHBOARD_DATA.cfa;
  document.getElementById('cfa-topic').textContent    = topic;
  document.getElementById('cfa-progress').textContent = progressText;
  document.getElementById('cfa-next').textContent     = next;
  const svg = document.getElementById('cfa-ring');
  const cx = 65, cy = 65, r = 52, dots = 60;
  const filled = Math.round((percent / 100) * dots);
  let inner = '';
  for(let i = 0; i < dots; i++){
    const angle = (i / dots) * Math.PI * 2 - Math.PI / 2;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    inner += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="2.2" fill="${i < filled ? 'var(--dot-fill)' : 'var(--dot-empty)'}"/>`;
  }
  inner += `<text x="${cx}" y="${cy-2}" text-anchor="middle" fill="var(--text-1)" font-size="24" font-family="var(--font-mono)">${percent}%</text>`;
  inner += `<text x="${cx}" y="${cy+16}" text-anchor="middle" fill="var(--text-3)" font-size="9" letter-spacing="1" font-family="var(--font-mono)">COMPLETE</text>`;
  svg.innerHTML = inner;
}

/* ================================================================
   CALENDAR
   ================================================================ */
function formatSyncAge(isoString) {
  if (!isoString) return '—';
  const ageMin = Math.round((Date.now() - new Date(isoString).getTime()) / 60000);
  if (ageMin < 2)  return 'just now';
  if (ageMin < 60) return `${ageMin}m ago`;
  return `${Math.round(ageMin / 60)}h ago`;
}

function renderCalendar() {
  const events = (DASHBOARD_DATA.gcal && DASHBOARD_DATA.gcal.events) || [];
  const calList = document.getElementById('cal-list');

  if (!events.length) {
    calList.innerHTML =
      '<div style="color:var(--text-3);font-size:12px;padding:8px 0">No timed events today</div>';
  } else {
    calList.innerHTML = events.map(e => `
      <div class="cal-row"><span class="cal-time">${e.time}</span><span class="cal-dot"></span><span>${e.label}</span></div>
    `).join('');
  }

  document.getElementById('cal-synced').textContent =
    formatSyncAge(DASHBOARD_DATA.gcal && DASHBOARD_DATA.gcal.syncedAt);
}

/* ================================================================
   UP NEXT
   ================================================================ */
function renderUpNext() {
  const items = Derived.getUpcomingItems(DASHBOARD_DATA);
  document.getElementById('upnext-list').innerHTML = items.length
    ? items.map(u => `<div class="up-row">
        <div class="up-left">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <span>${u.title}</span>
        </div>
        <span class="up-right">In ${u.inDays} day${u.inDays === 1 ? '' : 's'}</span>
      </div>`).join('')
    : '<div style="color:var(--text-3);font-size:12px;padding:8px 0">Nothing upcoming</div>';
}

/* ================================================================
   ATTENTION
   ================================================================ */
const ATT_ICON = { urgent: '!', warn: '~', info: 'i', error: '!' };
const ATT_TYPE = { urgent: 'urgent', warn: 'warn', info: 'info', error: 'urgent' };

function renderAttention() {
  const items = Derived.calculateAttentionItems(DASHBOARD_DATA);
  const el    = document.getElementById('attention-list');

  if (!items.length) {
    el.innerHTML = '<div class="att-clear">ALL CLEAR</div>';

  }

  el.innerHTML = items.map(i => `
    <div class="att-item">
      <div class="att-icon ${ATT_TYPE[i.type] || 'info'}">${ATT_ICON[i.type] || 'i'}</div>
      <div class="att-text">${i.text}</div>
    </div>`).join('');
}

/* ================================================================
   DAY STATUS
   ================================================================ */
const STATUS_CLASS = { 'ON TRACK': 'on-track', 'TIGHT': 'tight', 'OVERLOADED': 'overloaded', 'CLEAR': 'clear' };

function renderDayStatus() {
  const { total, done, pct, status } = Derived.calculateDayStatus(DASHBOARD_DATA);
  const cls = STATUS_CLASS[status] || 'clear';

  document.getElementById('daystatus-body').innerHTML = `
    <div class="status-label ${cls}">${status}</div>
    <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="status-row">
      <span>TASKS DONE</span>
      <span class="status-val">${done} / ${total}</span>
    </div>
    <div class="status-row">
      <span>COMPLETION</span>
      <span class="status-val">${pct}%</span>
    </div>`;
}

/* ================================================================
   THIS WEEK
   ================================================================ */
function renderWeek() {
  const { tasksTotal, tasksDone, overdue, focusSessions } = Derived.calculateWeeklyStats(DASHBOARD_DATA);

  document.getElementById('week-list').innerHTML = `
    <div class="week-row"><span class="week-key">TODAY'S TASKS</span><span class="week-val">${tasksDone} / ${tasksTotal}</span></div>
    <div class="week-row"><span class="week-key">OVERDUE</span><span class="week-val" style="color:${overdue > 0 ? 'var(--warn)' : 'var(--text-1)'}">${overdue}</span></div>
    <div class="week-row"><span class="week-key">FOCUS SESSIONS</span><span class="week-val">${focusSessions}</span></div>
    <div class="week-row"><span class="week-key">DATA SOURCE</span><span class="week-val" style="font-size:10px">${(DASHBOARD_DATA.ellie && DASHBOARD_DATA.ellie.connected) ? 'ELLIE' : 'GCAL'}</span></div>`;
}

/* ================================================================
   INIT
   ================================================================ */
loadData();
setInterval(loadData, DATA_REFRESH_MS);
// Re-render derived cards every minute (time-sensitive: staleness checks)
setInterval(() => { renderAttention(); renderDayStatus(); renderCalendar(); }, 60 * 1000);
